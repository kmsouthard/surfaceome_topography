# Publishes explorer/ as the repository's GitHub Pages site.
# Needs Pages switched on once: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Explorer

on:
  push:
    branches: [main]
    paths: ["explorer/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the deploy, so browsers never mix its files with an older one's
        run: |
          printf '{"version": "%s"}\n' "${GITHUB_SHA::12}" > explorer/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer
      - id: deployment
        uses: actions/deploy-pages@v4
